services:
  migrate:
    build:
      context: ./backend
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.container}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    init: true
    read_only: true
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.container}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.container}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.container}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env.container}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:?Set API_ALLOWED_ORIGINS in .env.container}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    volumes:
      - document_uploads:/app/uploads
      - model_cache:/home/node/.cache
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: runtime
    command: ["node", "dist/src/jobs/document.worker.main.js"]
    init: true
    read_only: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.container}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.container}
    volumes:
      - document_uploads:/app/uploads
      - model_cache:/home/node/.cache
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in .env.container}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    restart: unless-stopped

volumes:
  document_uploads:
  model_cache:
